<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniDoc AI — Academic RAG Assistant</title>
  <meta name="description" content="AI-powered academic assistant for 38+ engineering subjects. Get instant, grounded answers from your course materials." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ── */
    :root {
      --bg-base: #0a0e1a;
      --bg-panel: #111827;
      --bg-card: #1a2236;
      --bg-hover: #1f2d47;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.25);
      --accent2: #8b5cf6;
      --green: #10b981;
      --red: #ef4444;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #475569;
      --border: rgba(99,102,241,0.2);
      --border-subtle: rgba(255,255,255,0.06);
      --radius: 12px;
      --radius-sm: 8px;
      --sidebar-w: 280px;
      --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-base); color: var(--text-primary); overflow: hidden; }

    /* ── Layout ── */
    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-panel);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .logo-text h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-text span { font-size: 11px; color: var(--text-secondary); }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
    .badge::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .new-chat-btn {
      width: 100%; margin-top: 12px; padding: 9px; border-radius: var(--radius-sm);
      background: var(--accent); color: white; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: var(--transition); letter-spacing: 0.2px;
    }
    .new-chat-btn:hover { background: #5558ea; transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }

    .subjects-scroll { flex: 1; overflow-y: auto; padding: 8px 8px; }
    .subjects-scroll::-webkit-scrollbar { width: 4px; }
    .subjects-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .category-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: var(--text-muted); padding: 12px 8px 4px; text-transform: uppercase;
    }
    .subject-btn {
      width: 100%; text-align: left; border: none; cursor: pointer;
      background: transparent; color: var(--text-secondary);
      padding: 7px 10px; border-radius: var(--radius-sm);
      font-size: 12.5px; font-family: inherit;
      display: flex; align-items: center; gap: 8px;
      transition: var(--transition); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .subject-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .subject-btn.active { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--border); font-weight: 600; }
    .subject-btn .icon { font-size: 14px; flex-shrink: 0; }
    .type-tag { margin-left: auto; font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 4px; flex-shrink: 0; }
    .type-tag.lab { background: rgba(16,185,129,0.15); color: var(--green); }
    .type-tag.notes { background: rgba(99,102,241,0.15); color: var(--accent); }

    /* ── Main Chat Area ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .chat-header {
      padding: 16px 24px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; gap: 12px;
    }
    .subject-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 30px;
      background: var(--bg-card); border: 1px solid var(--border);
      font-size: 14px; font-weight: 600;
    }
    .model-selector-wrap { margin-left: auto; }
    .model-select {
      background: var(--bg-card); color: var(--text-secondary);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      padding: 6px 10px; font-size: 12px; font-family: inherit; cursor: pointer; outline: none;
    }
    .model-select:focus { border-color: var(--accent); }

    .messages {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Welcome State ── */
    .welcome {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px; gap: 16px;
    }
    .welcome-icon { font-size: 56px; margin-bottom: 4px; }
    .welcome h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .welcome p { color: var(--text-secondary); font-size: 14px; max-width: 440px; line-height: 1.6; }
    .sample-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
    .chip {
      padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 12.5px;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-secondary); transition: var(--transition);
    }
    .chip:hover { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }

    /* ── Messages ── */
    .msg { display: flex; gap: 10px; max-width: 840px; }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.ai { align-self: flex-start; }
    .avatar {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .msg.user .avatar { background: var(--accent); }
    .msg.ai .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .bubble {
      padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.65;
      max-width: calc(100% - 44px); white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--accent); color: white; border-radius: 12px 2px 12px 12px; }
    .msg.ai .bubble { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 2px 12px 12px 12px; color: var(--text-primary); }

    /* Typing indicator */
    .typing { display: flex; gap: 4px; align-items: center; padding: 8px 0; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }

    /* Shift notice */
    .shift-notice {
      font-size: 11px; color: var(--text-muted); padding: 4px 8px;
      border-left: 2px solid var(--accent); margin-top: 6px;
    }

    /* Markdown in AI response */
    .bubble h2, .bubble h3 { color: var(--accent); margin: 12px 0 6px; font-size: 14px; }
    .bubble strong { color: var(--text-primary); }
    .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }
    .bubble li { margin: 3px 0; }
    .bubble code { background: rgba(99,102,241,0.15); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: monospace; }
    .bubble pre { background: #0d1117; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    .bubble pre code { background: none; padding: 0; }

    /* ── Input Area ── */
    .input-area {
      padding: 16px 24px 20px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
    }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .input-box {
      flex: 1; min-height: 46px; max-height: 140px;
      padding: 12px 16px; border-radius: var(--radius);
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      color: var(--text-primary); font-family: inherit; font-size: 14px;
      resize: none; outline: none; line-height: 1.5;
    }
    .input-box::placeholder { color: var(--text-muted); }
    .input-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .send-btn {
      width: 46px; height: 46px; border-radius: var(--radius-sm);
      background: var(--accent); color: white; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; transition: var(--transition);
    }
    .send-btn:hover:not(:disabled) { background: #5558ea; transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .input-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: right; }

    /* Responsive */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .subject-badge span.title { display: none; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">📚</div>
        <div class="logo-text">
          <h1>OmniDoc AI</h1>
          <span>Academic RAG Assistant</span>
        </div>
      </div>
      <div class="badge">Live</div>
      <button class="new-chat-btn" onclick="newChat()">
        <span>＋</span> New Chat
      </button>
    </div>
    <div class="subjects-scroll" id="subjectsList"></div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <!-- Header -->
    <div class="chat-header">
      <div class="subject-badge" id="activeSubjectBadge">
        <span id="activeSubjectIcon">🌐</span>
        <span class="title" id="activeSubjectTitle">All Subjects</span>
      </div>
      <div class="model-selector-wrap">
        <select class="model-select" id="modelSelect">
          <option value="Auto Cascading Pool">⚡ Auto Cascading Pool</option>
          <option value="openai/gpt-oss-120b">OpenAI GPT-OSS 120B</option>
          <option value="qwen/qwen3.6-27b">Qwen 3.6 27B</option>
          <option value="openai/gpt-oss-20b">OpenAI GPT-OSS 20B</option>
          <option value="groq/compound-mini">Groq Compound Mini</option>
          <option value="groq/compound">Groq Compound</option>
          <option value="allam-2-7b">Allam 2 7B</option>
          <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout 17B</option>
          <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
          <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
        </select>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="welcome" id="welcomeState">
        <div class="welcome-icon" id="welcomeIcon">📚</div>
        <h2>Ask anything about your subjects</h2>
        <p>Select a subject from the sidebar, then ask any question. OmniDoc AI searches your course materials to give you grounded, accurate answers.</p>
        <div class="sample-chips" id="sampleChips"></div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-row">
        <textarea class="input-box" id="inputBox" rows="1" placeholder="Ask a question about your subject..."></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send (Enter)">➤</button>
      </div>
      <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
    </div>
  </main>
</div>

<script>
  // ── State ──
  let currentSubject = "All Subjects";
  let currentIcon = "🌐";
  let isStreaming = false;
  let chatHistory = "";

  // ── Sample Questions ──
  const SAMPLES = {
    "All Subjects": ["What is Machine Learning?", "Explain TCP/IP model", "What is an OS Deadlock?"],
    "AI": ["What is Turing Test?", "Explain A* search algorithm", "What is Heuristic Search?"],
    "ML notes": ["Explain supervised vs unsupervised", "What is overfitting?", "Explain Decision Tree"],
    "CN Notes": ["Explain TCP/IP layers", "What is subnetting?", "Explain DNS protocol"],
    "OS": ["What is a deadlock?", "Explain paging vs segmentation", "What is process scheduling?"],
    "Java": ["Explain OOP concepts in Java", "What is polymorphism?", "Explain Java threads"],
  };

  // ── Load Subjects ──
  async function loadSubjects() {
    try {
      const resp = await fetch("/api/subjects");
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      renderSidebar(data.categories);
    } catch (e) {
      console.error("Failed to load subjects:", e);
    }
  }

  function renderSidebar(categories) {
    const container = document.getElementById("subjectsList");
    container.innerHTML = "";

    // All Subjects button
    const allBtn = document.createElement("button");
    allBtn.className = "subject-btn active";
    allBtn.innerHTML = `<span class="icon">🌐</span><span>All Subjects</span>`;
    allBtn.onclick = () => selectSubject("All Subjects", "🌐", "All Subjects");
    allBtn.id = "btn_All Subjects";
    container.appendChild(allBtn);

    Object.entries(categories).forEach(([catLabel, subjects]) => {
      const label = document.createElement("div");
      label.className = "category-label";
      label.textContent = catLabel;
      container.appendChild(label);

      subjects.forEach(subj => {
        const btn = document.createElement("button");
        btn.className = "subject-btn";
        btn.id = `btn_${subj.key}`;
        const typeClass = subj.type.toLowerCase() === "lab" ? "lab" : "notes";
        btn.innerHTML = `
          <span class="icon">${subj.icon}</span>
          <span>${subj.title}</span>
          <span class="type-tag ${typeClass}">${subj.type}</span>
        `;
        btn.onclick = () => selectSubject(subj.key, subj.icon, subj.title);
        container.appendChild(btn);
      });
    });
  }

  function selectSubject(key, icon, title) {
    currentSubject = key;
    currentIcon = icon;
    document.querySelectorAll(".subject-btn").forEach(b => b.classList.remove("active"));
    const btn = document.getElementById(`btn_${key}`);
    if (btn) btn.classList.add("active");
    document.getElementById("activeSubjectIcon").textContent = icon;
    document.getElementById("activeSubjectTitle").textContent = title || key;
    document.getElementById("welcomeIcon").textContent = icon;
    updateSampleChips(key);
    document.getElementById("inputBox").placeholder = `Ask a question about ${title || key}...`;
  }

  function updateSampleChips(subjectKey) {
    const chips = document.getElementById("sampleChips");
    if (!chips) return;
    chips.innerHTML = "";
    const samples = SAMPLES[subjectKey] || SAMPLES["All Subjects"];
    samples.forEach(q => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = q;
      chip.onclick = () => { document.getElementById("inputBox").value = q; sendMessage(); };
      chips.appendChild(chip);
    });
  }

  // ── New Chat ──
  function newChat() {
    chatHistory = "";
    const msgs = document.getElementById("messages");
    msgs.innerHTML = `
      <div class="welcome" id="welcomeState">
        <div class="welcome-icon" id="welcomeIcon">${currentIcon}</div>
        <h2>Ask anything about your subjects</h2>
        <p>Select a subject from the sidebar, then ask any question.</p>
        <div class="sample-chips" id="sampleChips"></div>
      </div>`;
    updateSampleChips(currentSubject);
  }

  // ── Send Message ──
  async function sendMessage() {
    if (isStreaming) return;
    const inputBox = document.getElementById("inputBox");
    const question = inputBox.value.trim();
    if (!question) return;

    const engine = document.getElementById("modelSelect").value;

    // Hide welcome state
    const welcome = document.getElementById("welcomeState");
    if (welcome) welcome.remove();

    // Add user message
    appendMessage("user", question, "👤");
    inputBox.value = "";
    autoResizeTextarea(inputBox);

    // Add AI typing indicator
    const aiMsgId = `ai-${Date.now()}`;
    appendAIMessage(aiMsgId);

    isStreaming = true;
    document.getElementById("sendBtn").disabled = true;

    let fullResponse = "";

    try {
      const requestBody = {
        question,
        subject: currentSubject,
        chat_history: chatHistory,
        engine: engine,
      };

      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        const lines = decoder.decode(value, { stream: true }).split("\n");
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          try {
            const event = JSON.parse(line.slice(6));
            if (event.type === "token") {
              fullResponse += event.content;
              renderAIMessage(aiMsgId, fullResponse);
            } else if (event.type === "shift_notice" && event.shifts?.length) {
              addShiftNotice(aiMsgId, event.shifts);
            } else if (event.type === "done") {
              break;
            } else if (event.type === "error") {
              fullResponse += `\n\n⚠️ ${event.content}`;
              renderAIMessage(aiMsgId, fullResponse);
            }
          } catch (_) {}
        }
      }

      // Update chat history
      chatHistory += `\nUser: ${question}\nAssistant: ${fullResponse}\n`;

    } catch (err) {
      fullResponse = `⚠️ Server notice: ${err.message}. Please retry in a moment.`;
      renderAIMessage(aiMsgId, fullResponse);
    } finally {
      isStreaming = false;
      document.getElementById("sendBtn").disabled = false;
      scrollToBottom();
    }
  }

  // ── DOM Helpers ──
  function appendMessage(role, text, emoji) {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${emoji}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    msgs.appendChild(div);
    scrollToBottom();
  }

  function appendAIMessage(id) {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg ai";
    div.id = id;
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div>
        <div class="bubble" id="bubble-${id}">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      </div>
    `;
    msgs.appendChild(div);
    scrollToBottom();
  }

  function renderAIMessage(id, text) {
    const bubble = document.getElementById(`bubble-${id}`);
    if (bubble) {
      bubble.innerHTML = simpleMarkdown(text) + '<span style="opacity:0.5">▌</span>';
    }
    scrollToBottom();
  }

  function addShiftNotice(id, shifts) {
    const wrapper = document.querySelector(`#${id} > div`);
    if (!wrapper) return;
    const notice = document.createElement("div");
    notice.className = "shift-notice";
    notice.textContent = shifts.map(s => `⚡ Auto-shifted: ${s.from} → ${s.to}`).join(" · ");
    wrapper.appendChild(notice);
  }

  function scrollToBottom() {
    const msgs = document.getElementById("messages");
    msgs.scrollTop = msgs.scrollHeight;
  }

  // ── Simple Markdown Renderer ──
  function simpleMarkdown(text) {
    return escapeHtml(text)
      .replace(/```([^`]+)```/g, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^\* (.+)$/gm, '<li>$1</li>')
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      .replace(/\n/g, '<br>');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Textarea auto-resize ──
  function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  // ── Keyboard shortcuts ──
  document.addEventListener("DOMContentLoaded", () => {
    loadSubjects();
    updateSampleChips("All Subjects");

    const inputBox = document.getElementById("inputBox");
    inputBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    inputBox.addEventListener("input", () => autoResizeTextarea(inputBox));
  });
</script>
</body>
</html>
